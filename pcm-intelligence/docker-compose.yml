services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_pcm_password}
      POSTGRES_DB: pcm_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pcm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pcm_postgres:
